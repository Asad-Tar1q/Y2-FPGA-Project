<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EM Field Renderer — Control</title>
    <style>
      :root {
        --bg: #0e1116;
        --panel: #161b22;
        --panel-edge: #232a33;
        --text: #d7dee6;
        --muted: #8b95a1;
        --accent: #3aa0ff;
        --warn: #ffb454;
        --error: #ff6363;
      }
      html, body, #root {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
        font-size: 14px;
        overflow: hidden;
      }
      button {
        font: inherit;
        color: inherit;
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      input[type=range] { width: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
